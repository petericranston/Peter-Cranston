<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf9f7"/>

  <!-- Decorative washes (mirrors app background) -->
  <circle cx="100"  cy="-60"  r="480" fill="#f0c07a" opacity="0.30"/>
  <circle cx="1200" cy="0"    r="420" fill="#b8a0e8" opacity="0.22"/>
  <circle cx="1200" cy="680"  r="400" fill="#80d8a8" opacity="0.26"/>
  <circle cx="-60"  cy="680"  r="360" fill="#f0a0c0" opacity="0.22"/>

  <!-- Favicon lockup -->
  <rect x="100" y="180" width="72" height="72" rx="16" fill="#3d52c4"/>
  <g stroke="white" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(136,216)">
    <line x1="0"  y1="-18" x2="0"  y2="-9"/>
    <line x1="0"  y1="9"   x2="0"  y2="18"/>
    <line x1="-18" y1="0"  x2="-9" y2="0"/>
    <line x1="9"  y1="0"   x2="18" y2="0"/>
    <line x1="-12.7" y1="-12.7" x2="-6.4" y2="-6.4"/>
    <line x1="6.4"   y1="6.4"   x2="12.7" y2="12.7"/>
    <line x1="-12.7" y1="12.7"  x2="-6.4" y2="6.4"/>
    <line x1="6.4"   y1="-6.4"  x2="12.7" y2="-12.7"/>
  </g>

  <!-- Title -->
  <text x="196" y="240" font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="400" fill="#1c1a16" letter-spacing="-2">QuizAI</text>

  <!-- Tagline -->
  <text x="100" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#6b6760" letter-spacing="-0.3">AI-powered quizzes on any topic, instantly.</text>

  <!-- Feature pills -->
  <rect x="100" y="376" width="180" height="42" rx="21" fill="#ede9f8"/>
  <text x="190" y="402" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" fill="#3d52c4" text-anchor="middle">10 questions</text>

  <rect x="296" y="376" width="196" height="42" rx="21" fill="#ede9f8"/>
  <text x="394" y="402" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" fill="#3d52c4" text-anchor="middle">Multiplayer</text>

  <rect x="508" y="376" width="188" height="42" rx="21" fill="#ede9f8"/>
  <text x="602" y="402" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" fill="#3d52c4" text-anchor="middle">Any topic</text>

  <!-- Domain -->
  <text x="1100" y="600" font-family="'Courier New',monospace" font-size="20" fill="#c8c4bc" text-anchor="end">ai-powered-quiz-delta.vercel.app</text>
</svg>
